<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふにの絵合わせ|FUNI MEMORY GAME</title>
    <meta name="description" content="ふわふわキャラクターのふにと遊ぶ、かわいい絵合わせゲーム">

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .memory-page {
            max-width: 760px;
            margin: 0 auto;
            padding: 50px 20px 80px;
            text-align: center;
        }

        .memory-title {
            color: #806d64;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .memory-description {
            color: #9b8981;
            line-height: 1.9;
            margin-bottom: 30px;
        }

        .memory-start {
            display: inline-block;
            background: #f3dce1;
            color: #806d64;
            padding: 13px 32px;
            border-radius: 30px;
            text-decoration: none;
        }

        .memory-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 35px auto;
            max-width: 540px;
        }

        .memory-card {
            aspect-ratio: 1/1;
            background: #fff0f1;
            border: 2px solid #f4dfe2;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b9959e;
            font-size: 30px;
        }

        .memory-card {
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .memory-card:hover {
            transform: translateY(-3px);
        }

        .memory-back {
            color: #d9aeb6;
            font-size: 36px;
            font-weight: bold;
        }

        .memory-card img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .memory-card.is-matched {
            background: #fff8f8;
            border-color: #e8c4ca;
            cursor: default;
        }


        @media(max-width:480px) {
            .memory-board {
                gap: 8px;
            }

            .memory-card {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="memory-page">
        <p class="section-label">FUNI MEMORY GAME</p>
        <h1 class="memory-title">ふにの絵合わせ</h1>

        <p class="memory-description">
            ふにのカードを2枚めくってみよう。
            おなじ絵柄がそろったら大成功！
        </p>

        <a href="#" class="memory-start" id="memoryStart">ゲームスタート</a>
        <p id="gameMessage" class="memory-description">
            スタートボタンを押してね
        </p>

        <div class="memory-board" id="memoryBoard"></div>

        <div class="coloring-back">
            <a href="../index.html#play">← ふにとあそぼうに戻る</a>
        </div>

    </main>

    <script>
        const images = [
            "images/funi-01.png",
            "images/funi-02.png",
            "images/funi-03.png",
            "images/funi-04.png",
            "images/funi-05.png",
            "images/funi-06.png"
        ];

        const board = document.getElementById("memoryBoard");
        const startButton = document.getElementById("memoryStart");
        const message = document.getElementById("gameMessage");

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let matchedPairs = 0;

        startButton.addEventListener("click", function (event) {
            event.preventDefault();
            startGame();
        });

        function startGame() {
            board.innerHTML = "";
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            matchedPairs = 0;

            message.textContent = "同じ絵柄をそろえてね！";

            const cards = [...images, ...images];
            cards.sort(() => Math.random() - 0.5);

            cards.forEach(function (image) {
                const card = document.createElement("div");
                card.classList.add("memory-card");
                card.dataset.image = image;
                card.innerHTML = '<span class="memory-back">？</span>';

                card.addEventListener("click", function () {
                    flipCard(card);
                });

                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (
                lockBoard ||
                card.classList.contains("is-open") ||
                card.classList.contains("is-matched")
            ) {
                return;
            }

            card.classList.add("is-open");
            card.innerHTML = '<img src="' + card.dataset.image + '" alt="ふに">';

            if (!firstCard) {
                firstCard = card;
                return;
            }

            secondCard = card;
            lockBoard = true;

            if (firstCard.dataset.image === secondCard.dataset.image) {
                firstCard.classList.add("is-matched");
                secondCard.classList.add("is-matched");

                matchedPairs++;
                resetTurn();

                if (matchedPairs === 6) {
                    message.textContent = "大成功！ふにのカードが全部そろったよ♡";
                } else {
                    message.textContent = "やったね！同じ絵柄がそろったよ♡";
                }
            } else {
                message.textContent = "あれれ？もう一度チャレンジ！";

                setTimeout(function () {
                    firstCard.classList.remove("is-open");
                    secondCard.classList.remove("is-open");

                    firstCard.innerHTML = '<span class="memory-back">？</span>';
                    secondCard.innerHTML = '<span class="memory-back">？</span>';

                    resetTurn();
                }, 900);
            }
        }

        function resetTurn() {
            firstCard = null;
            secondCard = null;
            lockBoard = false;
        }
    </script>

</body>

</html>
